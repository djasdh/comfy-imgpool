name: agent-fix

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: issue number
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: agent-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      # 工具代码在 runner 主机的固定路径，不在被测仓库里，因此不执行 checkout。
      - name: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_ID: ${{ inputs.issue || github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: /home/umr/Projects/software-test-sandbox/scripts/runner.sh
